<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rudraksh Satta Matka - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 850px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        /* Interactive Auto Slideshow Framework */
        .slider-wrapper {
            display: flex;
            width: 100%;
            height: 100%;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
        }
        .slider-wrapper::-webkit-scrollbar { display: none; }
        .slide-frame {
            shrink-0;
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            object-fit: cover;
        }

        /* Professional Premium Loading Animation Overlay */
        #loading-screen {
            position: absolute;
            inset: 0;
            background-color: #ffffff;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
        }
        .loader-bar-container {
            width: 160px;
            height: 4px;
            background-color: #e5e7eb;
            border-radius: 9999px;
            overflow: hidden;
            margin-top: 20px;
            position: relative;
        }
        .loader-bar-progress {
            width: 40%;
            height: 100%;
            background: linear-gradient(to right, #16a34a, #10b981);
            border-radius: 9999px;
            position: absolute;
            animation: modern-loading 1.6s infinite ease-in-out;
        }
        @keyframes modern-loading {
            0% { left: -40%; width: 40%; }
            50% { width: 60%; }
            100% { left: 100%; width: 40%; }
        }
    </style>
</head>
<body>

<div class="app-container">

    <!-- PROFESSIONAL LOADING SCREEN OVERLAY -->
    <div id="loading-screen">
        <div class="flex flex-col items-center">
            <img src="https://i.imgur.com/hWJLthc.png" alt="Logo" class="w-20 h-20 object-contain animate-pulse">
            <h2 class="text-xl font-black text-gray-800 tracking-widest uppercase mt-4">RUDRAKSH</h2>
            <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mt-1">Connecting to Cloud Securely</p>
            <div class="loader-bar-container">
                <div class="loader-bar-progress"></div>
            </div>
        </div>
    </div>

    <!-- MAIN APP HEADER APPBAR -->
    <div class="bg-green-600 text-white px-4 py-3.5 flex items-center space-x-3 shadow-md sticky top-0 z-40">
        <img src="https://i.imgur.com/hWJLthc.png" alt="Logo" class="w-9 h-9 object-contain">
        <h1 class="font-black tracking-wider text-xl uppercase">RUDRAKSH</h1>
    </div>

    <!-- CONTENT FRAME SCROLLER -->
    <div class="flex-1 bg-gray-50 flex flex-col justify-between overflow-y-auto">
        
        <div class="p-4 space-y-5">
            <!-- SAME ATTRACTIVE REALTIME IMAGE SLIDER AS DASHBOARD -->
            <div class="relative w-full h-44 bg-gray-100 rounded-2xl overflow-hidden shadow-sm border border-gray-200/60">
                <div id="index-slider-container" class="slider-wrapper">
                    <img src="https://i.imgur.com/hWJLthc.png" class="slide-frame shrink-0" alt="Banner Placeholder">
                </div>
            </div>

            <!-- LOGIN CREDENTIALS CONTAINER FORM -->
            <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 space-y-4">
                <div class="text-center">
                    <h3 class="text-gray-800 font-black text-lg uppercase tracking-wide">Welcome Subscriber</h3>
                    <p class="text-xs text-gray-400 font-medium">Log in with your details to view calculations</p>
                </div>

                <div class="space-y-3 pt-2">
                    <div>
                        <label class="block text-[11px] text-gray-400 font-bold uppercase tracking-wider mb-1 px-1">Your Full Name</label>
                        <input type="text" id="user-name" placeholder="Enter full name" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm text-gray-800 font-bold focus:outline-none focus:border-green-500">
                    </div>
                    <div>
                        <label class="block text-[11px] text-gray-400 font-bold uppercase tracking-wider mb-1 px-1">10-Digit Mobile Number</label>
                        <input type="tel" id="user-mobile" inputmode="numeric" maxlength="10" placeholder="Enter mobile number" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm text-gray-800 font-mono font-bold tracking-widest focus:outline-none focus:border-green-500">
                    </div>
                </div>

                <button onclick="handleUserAuthentication()" class="w-full bg-green-600 hover:bg-green-700 text-white font-black py-3.5 rounded-2xl tracking-wider text-xs uppercase shadow-md transition-colors mt-2">
                    🔓 Access System Dashboard
                </button>
            </div>
        </div>

        <!-- FOOTER BRAND TRADEMARK TAG -->
        <div class="p-4 text-center">
            <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">© 2026 Rudraksh. All Rights Reserved.</p>
        </div>
    </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDVxg4EZHm4D2zMrz_ndLzcqx3wkhdPdVc",
        authDomain: "rudraksh-d74c3.firebaseapp.com",
        databaseURL: "https://rudraksh-d74c3-default-rtdb.firebaseio.com",
        projectId: "rudraksh-d74c3",
        storageBucket: "rudraksh-d74c3.firebasestorage.app",
        messagingSenderId: "270620722307",
        appId: "1:270620722307:web:5a6454b69e12c201f6c7b6",
        measurementId: "G-406NQEK3XV"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let activeSliderTimer = null;

    window.addEventListener('DOMContentLoaded', initializeLandingPage);

    function initializeAppCoresLoader() {
        const loadingOverlay = document.getElementById('loading-screen');
        setTimeout(() => {
            loadingOverlay.style.opacity = '0';
            loadingOverlay.style.visibility = 'hidden';
        }, 1200); // Gives a beautifully balanced 1.2s authentic transition lag
    }

    function initializeLandingPage() {
        // Safe Session Routing Skip Link
        if (localStorage.getItem('app_user_mobile')) {
            window.location.href = 'dashboard.html';
            return;
        }

        initializeAppCoresLoader();

        // Realtime Synchronized System Settings Listener for Slide URLs
        onSnapshot(doc(db, "system_config", "settings"), (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.data();
                if (data.slider_images && Array.isArray(data.slider_images)) {
                    setupIndexImageSlider(data.slider_images);
                }
            }
        });
    }

    function setupIndexImageSlider(images) {
        const slider = document.getElementById('index-slider-container');
        if (!slider) return;
        clearInterval(activeSliderTimer);
        
        const cleanImages = images.filter(url => url && url.trim() !== "" && url.startsWith('http'));
        if (cleanImages.length === 0) {
            slider.innerHTML = `<img src="https://i.imgur.com/hWJLthc.png" class="slide-frame shrink-0">`;
            return;
        }

        slider.innerHTML = '';
        cleanImages.forEach(url => {
            let finalUrl = url;
            if (url.includes("firebasestorage.googleapis.com") && !url.includes("%2F")) {
                finalUrl = url.replace("/o/slider_banners", "/o/slider_banners%2F");
            }
            slider.innerHTML += `<img src="${finalUrl}" class="slide-frame shrink-0" onerror="this.src='https://i.imgur.com/hWJLthc.png'">`;
        });

        let index = 0;
        if (cleanImages.length > 1) {
            activeSliderTimer = setInterval(() => {
                index++;
                if (index >= cleanImages.length) index = 0;
                slider.scrollTo({ left: index * slider.clientWidth, behavior: 'smooth' });
            }, 4000);
        }
    }

    window.handleUserAuthentication = async function() {
        const nameInput = document.getElementById('user-name').value.trim();
        const mobileInput = document.getElementById('user-mobile').value.trim();

        if (!nameInput) return alert("Please enter your Full Name.");
        if (mobileInput.length !== 10 || isNaN(mobileInput)) return alert("Please enter a valid 10-Digit Mobile Number.");

        // Show professional loading block animation state during registration tracking
        document.getElementById('loading-screen').style.visibility = 'visible';
        document.getElementById('loading-screen').style.opacity = '1';

        try {
            const userRef = doc(db, "users", mobileInput);
            
            // Checks if user profile records already sit on cloud tracks
            onSnapshot(userRef, async (snap) => {
                if (!snap.exists()) {
                    // Create an inactive subscription template cleanly for new users
                    await setDoc(userRef, {
                        name: nameInput,
                        mobile: mobileInput,
                        subscription: "inactive",
                        joinedAt: Date.now()
                    });
                }
                
                localStorage.setItem('app_user_mobile', mobileInput);
                window.location.href = 'dashboard.html';
            });
        } catch(e) {
            document.getElementById('loading-screen').style.opacity = '0';
            document.getElementById('loading-screen').style.visibility = 'hidden';
            alert("Network error. Try launching your browser loop terminal session again.");
        }
    }
</script>
</body>
</html>
