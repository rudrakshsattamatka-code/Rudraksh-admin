<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 850px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        @media (max-width: 450px) {
            .app-container {
                height: 100vh;
                max-height: 100vh;
            }
        }
    </style>
</head>
<body>

<div class="app-container">

    <!-- APP HEADER -->
    <div class="bg-green-600 text-white px-4 py-3 flex items-center justify-between shadow-md sticky top-0 z-40">
        <div class="flex items-center space-x-3">
            <img id="app-logo" src="https://i.imgur.com/hWJLthc.png" alt="Logo" class="w-10 h-10 object-contain">
            <div>
                <h1 id="welcome-user" class="font-bold tracking-wide text-sm">Loading...</h1>
                <p class="text-[10px] text-green-200">Secure Live Dashboard</p>
            </div>
        </div>
        <button onclick="handleLogout()" class="bg-orange-500 hover:bg-orange-600 px-3 py-1.5 text-xs font-bold rounded-lg shadow transition-colors">
            LOGOUT
        </button>
    </div>

    <!-- MAIN APP BODY -->
    <div class="flex-1 bg-gray-50 p-4 space-y-4 pb-8">

        <!-- USER PROFILE & DYNAMIC CLOCK -->
        <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 flex justify-between items-center">
            <div>
                <p class="text-xs text-gray-400 uppercase font-bold tracking-wider">Account Profile</p>
                <p id="profile-phone" class="text-gray-700 font-bold text-sm mt-0.5">Mobile: --</p>
                <!-- Clock repositioned right under the user profile tracking -->
                <div id="live-clock" class="text-[11px] text-gray-500 font-mono mt-1 font-semibold">00:00:00 AM</div>
            </div>
            <div id="sub-badge" class="px-3 py-1 rounded-full text-xs font-bold bg-gray-200 text-gray-600">
                Syncing...
            </div>
        </div>

        <!-- NOTICE BOARD -->
        <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 shadow-sm">
            <div class="flex items-center space-x-2 text-amber-800 mb-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                <h3 class="font-bold text-xs uppercase tracking-wide">Notice Board</h3>
            </div>
            <p id="notice-text" class="text-xs text-amber-900 leading-relaxed font-medium">
                Syncing live notices...
            </p>
        </div>

        <!-- MARKET CODES SECTION (No Refresh Required - Automatic) -->
        <div class="space-y-3">
            <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider px-1">Live Market Panel</h2>
            <div id="markets-container" class="space-y-3">
                <p class="text-xs text-center text-gray-400 py-4">Waiting on data streams...</p>
            </div>
        </div>

        <!-- CUSTOMER SERVICE TERMINAL -->
        <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 space-y-3">
            <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Customer Support Desk</h4>
            <div class="grid grid-cols-2 gap-3">
                <a href="https://wa.me/919113224019" target="_blank" class="flex items-center justify-center space-x-2 bg-emerald-500 hover:bg-emerald-600 text-white py-2.5 rounded-lg text-xs font-bold shadow-sm transition-colors">
                    <span>WhatsApp Chat</span>
                </a>
                <a href="tel:9113224019" class="flex items-center justify-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg text-xs font-bold shadow-sm transition-colors">
                    <span>Call Support</span>
                </a>
            </div>
        </div>

    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDVxg4EZHm4D2zMrz_ndLzcqx3wkhdPdVc",
        authDomain: "rudraksh-d74c3.firebaseapp.com",
        databaseURL: "https://rudraksh-d74c3-default-rtdb.firebaseio.com",
        projectId: "rudraksh-d74c3",
        storageBucket: "rudraksh-d74c3.firebasestorage.app",
        messagingSenderId: "270620722307",
        appId: "1:270620722307:web:5a6454b69e12c201f6c7b6",
        measurementId: "G-406NQEK3XV"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    setInterval(() => {
        document.getElementById('live-clock').innerText = new Date().toLocaleTimeString();
    }, 1000);

    window.addEventListener('DOMContentLoaded', beginLiveEngine);

    function beginLiveEngine() {
        const savedMobile = localStorage.getItem('app_user_mobile');
        if (!savedMobile) {
            window.location.href = 'index.html';
            return;
        }

        document.getElementById('profile-phone').innerText = "Mobile: " + savedMobile;

        // 1. User Profile Listener
        onSnapshot(doc(db, "users", savedMobile), async (snapshot) => {
            if (!snapshot.exists()) { handleLogout(); return; }
            const u = snapshot.data();
            document.getElementById('welcome-user').innerText = "Hi, " + (u.name || "User");
            
            const badge = document.getElementById('sub-badge');
            badge.className = "px-3 py-1 rounded-full text-xs font-bold ";
            if (u.subscription === "active") {
                badge.innerText = "Active";
                badge.classList.add('bg-green-100', 'text-green-700');
            } else {
                badge.innerText = "Inactive";
                badge.classList.add('bg-orange-100', 'text-orange-700');
            }
            await setDoc(doc(db, "users", savedMobile), { lastVisited: new Date().toLocaleString(), isOnline: true }, { merge: true });
        });

        // 2. Global Configurations Listener
        onSnapshot(doc(db, "system_config", "settings"), (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.data();
                if (data.logo_url) document.getElementById('app-logo').src = data.logo_url;
                if (data.notice_text) document.getElementById('notice-text').innerText = data.notice_text;
            }
        });

        // 3. Realtime Market Updates Streamer
        onSnapshot(collection(db, "markets"), (querySnapshot) => {
            const container = document.getElementById('markets-container');
            container.innerHTML = '';

            if (querySnapshot.empty) {
                container.innerHTML = `<p class="text-xs text-center text-gray-400 py-4">No active markets streaming.</p>`;
                return;
            }

            querySnapshot.forEach((mDoc) => {
                const m = mDoc.data();
                
                // Extract parameters safely
                const openPana = m.openPana || "•••";
                const openDigit = m.openDigit !== undefined && m.openDigit !== "" ? m.openDigit : "•";
                const closeDigit = m.closeDigit !== undefined && m.closeDigit !== "" ? m.closeDigit : "•";
                const closePana = m.closePana || "•••";
                
                const timeOpen = m.timeOpen || "12:30 PM";
                const timeClose = m.timeClose || "02:30 PM";

                // Generate centered market view card logic
                container.innerHTML += `
                    <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100 flex flex-col items-center text-center">
                        <!-- Centered Market Name -->
                        <h3 class="font-black text-gray-800 tracking-wide text-lg uppercase">${mDoc.id}</h3>
                        
                        <!-- Combined Mathematical Data Display directly under name -->
                        <div class="mt-2 bg-gray-50 border border-gray-100 rounded-xl px-6 py-2 font-mono text-xl font-bold tracking-widest text-orange-600 shadow-inner">
                            <span>${openPana}</span>
                            <span class="text-gray-900 mx-1">-${openDigit}${closeDigit}-</span>
                            <span>${closePana}</span>
                        </div>

                        <!-- Timing layout array pinned at the base -->
                        <div class="w-full border-t border-gray-100 mt-4 pt-3 flex justify-between text-[11px] font-semibold text-gray-400">
                            <div>Open: <span class="text-green-600 font-mono">${timeOpen}</span></div>
                            <div>Close: <span class="text-red-500 font-mono">${timeClose}</span></div>
                        </div>
                    </div>
                `;
            });
        });
    }

    window.handleLogout = async function() {
        const savedMobile = localStorage.getItem('app_user_mobile');
        if (savedMobile) { try { await setDoc(doc(db, "users", savedMobile), { isOnline: false }, { merge: true }); } catch(e) {} }
        localStorage.removeItem('app_user_mobile');
        window.location.href = 'index.html';
    }
</script>

</body>
</html>
