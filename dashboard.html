<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 850px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        @media (max-width: 450px) {
            .app-container {
                height: 100vh;
                max-height: 100vh;
            }
        }
    </style>
</head>
<body>

<div class="app-container">

    <!-- APP HEADER -->
    <div class="bg-green-600 text-white px-4 py-3 flex items-center justify-between shadow-md sticky top-0 z-40">
        <div class="flex items-center space-x-3">
            <!-- Dynamic Logo Controlled by Admin -->
            <img id="app-logo" src="https://i.imgur.com/hWJLthc.png" alt="Logo" class="w-10 h-10 object-contain">
            <div>
                <h1 id="welcome-user" class="font-bold tracking-wide text-sm">Loading profile...</h1>
                <div id="live-clock" class="text-[11px] text-green-100 font-mono">00:00:00 AM</div>
            </div>
        </div>
        <button onclick="handleLogout()" class="bg-orange-500 hover:bg-orange-600 px-3 py-1.5 text-xs font-bold rounded-lg shadow transition-colors">
            LOGOUT
        </button>
    </div>

    <!-- MAIN APP BODY -->
    <div class="flex-1 bg-gray-50 p-4 space-y-4 pb-8">

        <!-- USER PROFILE & SUBSCRIPTION STATUS CARD -->
        <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-100">
            <div class="flex justify-between items-center">
                <div>
                    <p class="text-xs text-gray-400 uppercase font-bold tracking-wider">Account Profile</p>
                    <p id="profile-phone" class="text-gray-700 font-semibold text-sm mt-0.5">Mobile: --</p>
                </div>
                <div id="sub-badge" class="px-3 py-1 rounded-full text-xs font-bold bg-gray-200 text-gray-600 animate-pulse">
                    Checking...
                </div>
            </div>
            
            <!-- Dynamic Activation Banner -->
            <div id="get-sub-banner" class="hidden mt-3 bg-gradient-to-r from-orange-500 to-amber-500 text-white p-3 rounded-lg flex justify-between items-center shadow-sm">
                <div>
                    <p class="font-bold text-xs">Unlock Market Results</p>
                    <p class="text-[10px] text-orange-100">Get instant daily activation access</p>
                </div>
                <a href="https://wa.me/919113224019?text=Hello%20I%20want%20to%20activate%20my%20subscription" target="_blank" class="bg-white text-orange-600 text-[11px] font-bold px-3 py-1.5 rounded-md shadow-sm hover:bg-gray-50 transition-colors">
                    Get Active
                </a>
            </div>
        </div>

        <!-- NOTICE BOARD (Admin Live Updates Stream Here) -->
        <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 shadow-sm">
            <div class="flex items-center space-x-2 text-amber-800 mb-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                <h3 class="font-bold text-xs uppercase tracking-wide">Notice Board</h3>
            </div>
            <p id="notice-text" class="text-xs text-amber-900 leading-relaxed font-medium">
                Loading system notice announcements...
            </p>
        </div>

        <!-- MARKET NAMES AND LIVE PREDICTIONS SECTION (Fully Real-time & Dynamic) -->
        <div class="space-y-3">
            <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider px-1">Live Market Results</h2>
            <div id="markets-container" class="space-y-3">
                <!-- Admin created markets will populate completely dynamically here -->
                <p class="text-xs text-center text-gray-400 py-4">Syncing live charts...</p>
            </div>
        </div>

        <!-- CUSTOMER SUPPORT DESK -->
        <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 space-y-3">
            <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Customer Support Desk</h4>
            <div class="grid grid-cols-2 gap-3">
                <a href="https://wa.me/919113224019" target="_blank" class="flex items-center justify-center space-x-2 bg-emerald-500 hover:bg-emerald-600 text-white py-2.5 rounded-lg text-xs font-bold shadow-sm transition-colors">
                    <span>WhatsApp Chat</span>
                </a>
                <a href="tel:9113224019" class="flex items-center justify-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg text-xs font-bold shadow-sm transition-colors">
                    <span>Call Support</span>
                </a>
            </div>
        </div>

    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDVxg4EZHm4D2zMrz_ndLzcqx3wkhdPdVc",
        authDomain: "rudraksh-d74c3.firebaseapp.com",
        databaseURL: "https://rudraksh-d74c3-default-rtdb.firebaseio.com",
        projectId: "rudraksh-d74c3",
        storageBucket: "rudraksh-d74c3.firebasestorage.app",
        messagingSenderId: "270620722307",
        appId: "1:270620722307:web:5a6454b69e12c201f6c7b6",
        measurementId: "G-406NQEK3XV"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Dynamic Live Clock
    setInterval(() => {
        document.getElementById('live-clock').innerText = new Date().toLocaleTimeString();
    }, 1000);

    window.addEventListener('DOMContentLoaded', startRealtimeSync);

    function startRealtimeSync() {
        const savedMobile = localStorage.getItem('app_user_mobile');
        if (!savedMobile) {
            window.location.href = 'index.html';
            return;
        }

        document.getElementById('profile-phone').innerText = "Mobile: " + savedMobile;
        let userSubscriptionStatus = "inactive";

        // 1. LISTEN TO USER DATA CHANGES REAL-TIME (Sub state, telemetry, blocks)
        onSnapshot(doc(db, "users", savedMobile), async (snapshot) => {
            if (!snapshot.exists()) {
                handleLogout();
                return;
            }

            const userData = snapshot.data();
            document.getElementById('welcome-user').innerText = "Hi, " + (userData.name || "User");
            userSubscriptionStatus = userData.subscription || "inactive";

            // Update Subscription UI Elements instantly
            const badge = document.getElementById('sub-badge');
            const banner = document.getElementById('get-sub-banner');
            badge.classList.remove('animate-pulse', 'bg-gray-200', 'text-gray-600', 'bg-green-100', 'text-green-700', 'bg-orange-100', 'text-orange-700');

            if (userSubscriptionStatus === "active") {
                badge.innerText = "Active";
                badge.classList.add('bg-green-100', 'text-green-700');
                banner.classList.add('hidden');
            } else {
                badge.innerText = "Inactive";
                badge.classList.add('bg-orange-100', 'text-orange-700');
                banner.classList.remove('hidden');
            }

            // Sync user online presence data silently
            await setDoc(doc(db, "users", savedMobile), {
                lastVisited: new Date().toLocaleString(),
                isOnline: true
            }, { merge: true });
        });

        // 2. LISTEN TO GLOBAL APP SETTINGS REAL-TIME (Logo, Notices)
        onSnapshot(doc(db, "system_config", "settings"), (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.data();
                if (data.logo_url) document.getElementById('app-logo').src = data.logo_url;
                if (data.notice_text) document.getElementById('notice-text').innerText = data.notice_text;
            }
        });

        // 3. LISTEN TO MARKETS REAL-TIME (Add, remove, change results instantly)
        onSnapshot(collection(db, "markets"), (querySnapshot) => {
            const container = document.getElementById('markets-container');
            container.innerHTML = ''; // Clear stale UI items

            if (querySnapshot.empty) {
                container.innerHTML = `<p class="text-xs text-center text-gray-400 py-4">No active markets configured.</p>`;
                return;
            }

            querySnapshot.forEach((marketDoc) => {
                const marketName = marketDoc.id;
                const marketValue = marketDoc.data().value || "---";

                // Check if we apply blurred masking overlay based on current real-time subscription evaluation
                const blurClass = userSubscriptionStatus === "active" ? "" : "filter blur-sm select-none";

                container.innerHTML += `
                    <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 flex justify-between items-center transition-all">
                        <div>
                            <h3 class="font-bold text-gray-800 tracking-wide text-base">${marketName}</h3>
                            <p class="text-[11px] text-green-600 font-semibold tracking-wide">Live Consolidated Chart</p>
                        </div>
                        <div class="text-right">
                            <div class="font-mono text-lg font-bold tracking-widest text-gray-900 ${blurClass}">
                                ${marketValue}
                            </div>
                            <p class="text-[10px] text-gray-400 mt-0.5 font-medium">Updated Live</p>
                        </div>
                    </div>
                `;
            });
        });
    }

    window.handleLogout = async function() {
        const savedMobile = localStorage.getItem('app_user_mobile');
        if (savedMobile) {
            try {
                await setDoc(doc(db, "users", savedMobile), { isOnline: false }, { merge: true });
            } catch(e) {}
        }
        localStorage.removeItem('app_user_mobile');
        window.location.href = 'index.html';
    }
</script>

</body>
</html>
