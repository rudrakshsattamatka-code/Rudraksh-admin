<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rudraksh Admin App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 850px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .app-container::-webkit-scrollbar { display: none; }
        @media (max-width: 450px) {
            .app-container { height: 100vh; max-height: 100vh; }
        }
    </style>
</head>
<body>

<div class="app-container">

    <!-- ADMIN GATE PIN SCREEN -->
    <div id="admin-gate" class="absolute inset-0 bg-gray-950 flex flex-col items-center justify-center p-6 z-50">
        <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800 w-full max-w-xs text-center">
            <h1 class="text-lg font-black text-orange-500 mb-1">Admin App Portal</h1>
            <p class="text-[11px] text-gray-400 mb-5">Enter Master 4-Digit Security PIN</p>
            <input type="password" id="gate-pin" inputmode="numeric" maxlength="4" placeholder="••••" class="w-full bg-gray-950 border border-gray-700 text-white rounded-xl p-2.5 text-center tracking-widest text-xl focus:outline-none mb-4">
            <button onclick="unlockAdminPanel()" class="w-full bg-orange-500 text-white font-bold py-3 rounded-xl text-xs uppercase tracking-wider">Verify Session</button>
        </div>
    </div>

    <!-- MAIN NAV HEADER -->
    <div class="bg-gray-900 text-white px-4 py-3 flex items-center justify-between shadow-md sticky top-0 z-40">
        <div>
            <h2 class="font-black text-sm tracking-wide text-orange-500">RUDRAKSH ADMIN</h2>
            <p class="text-[9px] text-gray-400">Mobile Console Interface</p>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="handleAdminLogout()" class="bg-red-600/20 text-red-400 border border-red-500/30 px-2.5 py-1 text-[10px] font-bold rounded-lg">LOGOUT</button>
        </div>
    </div>

    <!-- BOTTOM APP BAR NAVIGATION SELECTOR TAB -->
    <div class="bg-white border-t border-gray-100 grid grid-cols-3 text-center text-[11px] font-bold text-gray-400 sticky bottom-0 z-40 shadow-inner">
        <button onclick="openTab('system')" id="nav-system" class="py-3 border-t-2 border-orange-500 text-orange-500">Settings</button>
        <button onclick="openTab('games')" id="nav-games" class="py-3 border-t-2 border-transparent">Games</button>
        <button onclick="openTab('users')" id="nav-users" class="py-3 border-t-2 border-transparent relative">Users <span id="req-dot" class="hidden absolute top-2 right-6 w-2 h-2 bg-red-500 rounded-full"></span></button>
    </div>

    <!-- APP SCROLLER AREA -->
    <div class="flex-1 bg-gray-50 p-4 space-y-4 pb-12">

        <!-- TAB SECTION 1: GLOBAL CONFIGURATIONS -->
        <div id="tab-system" class="space-y-4">
            <!-- Price and Parameter Inputs -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-3">
                <h3 class="font-black text-xs text-orange-500 uppercase tracking-wider">Subscription Control & Pricing</h3>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] text-gray-400 font-bold mb-1">1 Day Price (₹)</label>
                        <input type="number" id="cfg-p-day" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2 text-xs text-gray-800 font-bold">
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-400 font-bold mb-1">1 Week Price (₹)</label>
                        <input type="number" id="cfg-p-week" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2 text-xs text-gray-800 font-bold">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] text-gray-400 font-bold mb-1">Receiver UPI ID Address</label>
                    <input type="text" id="cfg-upi" placeholder="rudraksh@upi" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2 text-xs text-gray-800 font-mono">
                </div>
                <div>
                    <label class="block text-[10px] text-gray-400 font-bold mb-1">Notice Text Broadcast</label>
                    <textarea id="cfg-notice" rows="2" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2 text-xs text-gray-800"></textarea>
                </div>
                <button onclick="saveSystemConfig()" class="w-full bg-green-600 text-white font-bold py-2.5 rounded-xl text-xs uppercase tracking-wider">Save Parameters</button>
            </div>

            <!-- Image Sliders Gallery Storage Bucket Inputs -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-2">
                <h3 class="font-black text-xs text-orange-500 uppercase tracking-wider mb-2">Gallery Image Banners (1-6)</h3>
                <div class="space-y-2" id="slider-inputs-zone"></div>
            </div>
        </div>

        <!-- TAB SECTION 2: GAME MODIFICATION ENGINE -->
        <div id="tab-games" class="space-y-4 hidden">
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-3">
                <h3 class="font-black text-xs text-orange-500 uppercase tracking-wider">Add/Edit Game Target</h3>
                <div class="grid grid-cols-3 gap-2">
                    <div class="col-span-2">
                        <label class="block text-[10px] text-gray-400 font-bold mb-1">Game Name</label>
                        <input type="text" id="mkt-name" placeholder="SRIDEVI" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2 text-xs uppercase">
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-400 font-bold mb-1">Serial Sort</label>
                        <input type="number" id="mkt-serial" placeholder="1" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2 text-xs">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] text-gray-400 font-bold mb-1">Display Timestamp</label>
                    <input type="text" id="mkt-date" placeholder="17/06/2026 9:35 AM" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2 text-xs font-mono">
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-[10px] text-gray-400 font-bold mb-1">OTC</label>
                        <input type="text" id="mkt-otc" placeholder="0 5" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2 text-xs font-mono">
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-400 font-bold mb-1">Jodi</label>
                        <input type="text" id="mkt-jodi" placeholder="02 58" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2 text-xs font-mono">
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-400 font-bold mb-1">Panel</label>
                        <input type="text" id="mkt-panel" placeholder="370 127" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2 text-xs font-mono">
                    </div>
                </div>
                <button onclick="addOrUpdateMarket()" class="w-full bg-orange-500 text-white font-bold py-2.5 rounded-xl text-xs uppercase tracking-wider">Publish Game Update</button>
            </div>

            <!-- Realtime active markets listed below -->
            <div id="admin-markets-list" class="space-y-2"></div>
        </div>

        <!-- TAB SECTION 3: SUBSCRIPTION SYSTEM QUEUE -->
        <div id="tab-users" class="space-y-4 hidden">
            <!-- LIVE REQUEST PAYMENTS QUEUE BOX -->
            <div class="bg-orange-50 rounded-2xl p-4 border border-orange-200 space-y-2">
                <h3 class="font-black text-xs text-orange-800 uppercase tracking-wider">⚠️ Pending Payments Queue (3 min Timer)</h3>
                <div id="deposit-queue-zone" class="space-y-2">
                    <p class="text-[11px] text-orange-600 font-semibold italic">No active requests floating in verification.</p>
                </div>
            </div>

            <!-- MASTER SUBSCRIBERS DIRECTORY -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-3">
                <h3 class="font-black text-xs text-gray-400 uppercase tracking-wider">Subscribers Directory</h3>
                <div id="users-directory-zone" class="space-y-3"></div>
            </div>
        </div>

    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDVxg4EZHm4D2zMrz_ndLzcqx3wkhdPdVc",
        authDomain: "rudraksh-d74c3.firebaseapp.com",
        databaseURL: "https://rudraksh-d74c3-default-rtdb.firebaseio.com",
        projectId: "rudraksh-d74c3",
        storageBucket: "rudraksh-d74c3.firebasestorage.app",
        messagingSenderId: "270620722307",
        appId: "1:270620722307:web:5a6454b69e12c201f6c7b6",
        measurementId: "G-406NQEK3XV"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);
    let masterAdminPin = "9999";
    let globalMarketsCache = {};

    // Dynamic slider input boxes generation code
    const inputsZone = document.getElementById('slider-inputs-zone');
    inputsZone.innerHTML = '';
    for(let i=1; i<=6; i++) {
        inputsZone.innerHTML += `
            <div class="bg-gray-50 p-2 rounded-xl border border-gray-200 flex flex-col space-y-1">
                <div class="flex justify-between items-center text-[9px] text-gray-400 font-bold"><span>SLOT ${i}</span><span id="status-${i}" class="text-gray-400">Empty</span></div>
                <input type="text" id="slide-${i}" class="w-full bg-white border border-gray-200 rounded-lg p-1 text-[11px] text-gray-800 focus:outline-none">
                <input type="file" id="file-${i}" accept="image/*" onchange="uploadImageFromGallery(${i})" class="text-[9px] text-gray-500 file:py-1 file:px-2 file:rounded file:border-0 file:bg-orange-500/10 file:text-orange-600 font-bold cursor-pointer">
            </div>
        `;
    }

    window.addEventListener('DOMContentLoaded', checkAdminPersistence);

    function checkAdminPersistence() {
        if (localStorage.getItem('admin_session_auth') === "verified") {
            document.getElementById('admin-gate').classList.add('hidden');
            loadLiveHooks();
        }
    }

    window.unlockAdminPanel = async function() {
        const pinInput = document.getElementById('gate-pin').value.trim();
        const configDoc = await getDoc(doc(db, "system_config", "settings"));
        if(configDoc.exists()) { masterAdminPin = configDoc.data().admin_pin || "9999"; }
        if(pinInput === masterAdminPin) {
            localStorage.setItem('admin_session_auth', 'verified');
            document.getElementById('admin-gate').classList.add('hidden');
            loadLiveHooks();
        } else { alert("Incorrect administrative safety PIN."); }
    }

    window.handleAdminLogout = () => { localStorage.removeItem('admin_session_auth'); window.location.reload(); }

    window.openTab = function(tabId) {
        ['system', 'games', 'users'].forEach(t => {
            document.getElementById('tab-'+t).classList.add('hidden');
            document.getElementById('nav-'+t).className = "py-3 border-t-2 border-transparent";
        });
        document.getElementById('tab-'+tabId).classList.remove('hidden');
        document.getElementById('nav-'+tabId).className = "py-3 border-t-2 border-orange-500 text-orange-500";
    }

    window.uploadImageFromGallery = async function(slot) {
        const file = document.getElementById(`file-${slot}`).files[0];
        const label = document.getElementById(`status-${slot}`);
        if(!file) return;
        label.innerText = "UPLOADING..."; label.className = "text-orange-500 font-bold animate-pulse";
        try {
            const snapshot = await uploadBytes(ref(storage, `slider_banners/slot_${slot}_${Date.now()}`), file);
            const downloadUrl = await getDownloadURL(snapshot.ref);
            document.getElementById(`slide-${slot}`).value = downloadUrl;
            label.innerText = "✓ UPLOADED"; label.className = "text-green-600 font-bold";
        } catch(e) { label.innerText = "❌ FAILED"; label.className = "text-red-500 font-bold"; }
    }

    function loadLiveHooks() {
        // 1. Live settings hooks sync
        onSnapshot(doc(db, "system_config", "settings"), (snap) => {
            if(snap.exists()) {
                const s = snap.data();
                document.getElementById('cfg-notice').value = s.notice_text || '';
                document.getElementById('cfg-phone').value = s.support_phone || '';
                document.getElementById('cfg-p-day').value = s.price_day || "1100";
                document.getElementById('cfg-p-week').value = s.price_week || "5100";
                document.getElementById('cfg-upi').value = s.upi_address || "rudraksh@upi";
                document.getElementById('cfg-pin').value = s.admin_pin || '';
                const imgs = s.slider_images || [];
                for(let i=1; i<=6; i++) { if(document.getElementById(`status-${i}`).innerText !== "UPLOADING...") document.getElementById(`slide-${i}`).value = imgs[i-1] || ''; }
            }
        });

        // 2. Realtime Game sorting engine listed cards loops
        onSnapshot(collection(db, "markets"), (querySnapshot) => {
            const list = document.getElementById('admin-markets-list');
            list.innerHTML = '';
            const sorted = querySnapshot.docs.sort((a,b) => (Number(a.data().serialNo)||999) - (Number(b.data().serialNo)||999));
            sorted.forEach(doc => {
                const m = doc.data();
                globalMarketsCache[doc.id] = m;
                list.innerHTML += `
                    <div class="bg-white p-3 rounded-xl border border-gray-200 flex justify-between items-center cursor-pointer" onclick="populateMarketForm('${doc.id}')">
                        <div><span class="text-xs font-black text-orange-500 font-mono mr-1">[${m.serialNo}]</span><span class="font-bold text-gray-800 text-xs uppercase">${doc.id}</span></div>
                        <div class="text-right space-x-2">
                            <button onclick="event.stopPropagation(); deleteMarket('${doc.id}')" class="text-red-500 text-xs font-bold">Delete</button>
                        </div>
                    </div>`;
            });
        });

        // 3. Telemetry subscribers directory
        onSnapshot(collection(db, "users"), (querySnapshot) => {
            const container = document.getElementById('users-directory-zone');
            container.innerHTML = '';
            querySnapshot.forEach(uDoc => {
                const u = uDoc.data();
                const subBadge = u.subscription === "active" ? '<span class="text-green-600 bg-green-50 px-2 py-0.5 rounded font-bold text-[10px]">Active</span>' : '<span class="text-red-500 bg-red-50 px-2 py-0.5 rounded font-bold text-[10px]">Inactive</span>';
                container.innerHTML += `
                    <div class="bg-gray-50 border border-gray-100 p-3 rounded-xl flex justify-between items-center text-xs">
                        <div><p class="font-bold text-gray-800">${u.name || 'User'}</p><p class="text-[10px] text-gray-400 font-mono">${uDoc.id}</p></div>
                        <div class="flex items-center space-x-2">${subBadge}<button onclick="toggleMembership('${uDoc.id}', '${u.subscription}')" class="bg-blue-600 text-white px-2 py-1 rounded-lg text-[10px] font-bold">Toggle</button></div>
                    </div>`;
            });
        });

        // 4. Verification Queue Monitor (The 3 Minute lockdown interceptor handler)
        onSnapshot(collection(db, "deposits"), (querySnapshot) => {
            const zone = document.getElementById('deposit-queue-zone');
            const dot = document.getElementById('req-dot');
            zone.innerHTML = '';
            
            if(querySnapshot.empty) {
                zone.innerHTML = `<p class="text-[11px] text-orange-600 font-semibold italic">No active validation requests floating.</p>`;
                dot.classList.add('hidden');
                return;
            }
            
            dot.classList.remove('hidden');
            querySnapshot.forEach(dDoc => {
                const d = dDoc.data();
                if(d.status !== "pending") return;
                zone.innerHTML += `
                    <div class="bg-white p-3 rounded-xl border border-orange-200 flex flex-col space-y-2 text-xs">
                        <div class="flex justify-between font-bold"><span>User: <span class="font-mono text-gray-800">${d.userMobile}</span></span><span class="text-green-600">Amount: ₹${d.amount}</span></div>
                        <div class="grid grid-cols-2 gap-2 pt-1">
                            <button onclick="approvePaymentRequest('${d.userMobile}', '${dDoc.id}')" class="bg-green-600 text-white py-1.5 rounded-lg font-bold text-[11px] uppercase">Approve Access</button>
                            <button onclick="rejectPaymentRequest('${dDoc.id}')" class="bg-red-600 text-white py-1.5 rounded-lg font-bold text-[11px] uppercase">Reject/Cancel</button>
                        </div>
                    </div>`;
            });
        });
    }

    window.populateMarketForm = function(id) {
        const m = globalMarketsCache[id]; if(!m) return;
        document.getElementById('mkt-name').value = id;
        document.getElementById('mkt-serial').value = m.serialNo || '';
        document.getElementById('mkt-date').value = m.gameDate || '';
        document.getElementById('mkt-otc').value = m.otcValue || '';
        document.getElementById('mkt-jodi').value = m.jodiValue || '';
        document.getElementById('mkt-panel').value = m.panelValue || '';
    }

    window.saveSystemConfig = async function() {
        const slider_images = [];
        for(let i=1; i<=6; i++) { const v = document.getElementById(`slide-${i}`).value.trim(); if(v) slider_images.push(v); }
        await setDoc(doc(db, "system_config", "settings"), {
            notice_text: document.getElementById('cfg-notice').value.trim(),
            support_phone: document.getElementById('cfg-phone').value.trim(),
            price_day: document.getElementById('cfg-p-day').value.trim(),
            price_week: document.getElementById('cfg-p-week').value.trim(),
            upi_address: document.getElementById('cfg-upi').value.trim(),
            admin_pin: document.getElementById('cfg-pin').value.trim(),
            slider_images
        }, { merge: true });
        alert("Global platform configurations successfully saved.");
    }

    window.addOrUpdateMarket = async function() {
        const name = document.getElementById('mkt-name').value.trim().toUpperCase(); if(!name) return alert("Enter Game Name.");
        await setDoc(doc(db, "markets", name), {
            serialNo: Number(document.getElementById('mkt-serial').value) || 0,
            gameDate: document.getElementById('mkt-date').value.trim(),
            otcValue: document.getElementById('mkt-otc').value.trim(),
            jodiValue: document.getElementById('mkt-jodi').value.trim(),
            panelValue: document.getElementById('mkt-panel').value.trim()
        }, { merge: true });
        alert("Game Section template published.");
    }

    window.approvePaymentRequest = async function(userMobile, docId) {
        await updateDoc(doc(db, "users", userMobile), { subscription: "active" });
        await deleteDoc(doc(db, "deposits", docId));
        alert("Access approved. Client unlocked instantly.");
    }

    window.rejectPaymentRequest = async function(docId) {
        await updateDoc(doc(db, "deposits", docId), { status: "rejected" });
        alert("Request rejected. Lockdown screen dismissed on user side.");
    }

    window.toggleMembership = async function(id, cur) { await updateDoc(doc(db, "users", id), { subscription: cur === "active" ? "inactive" : "active" }); }
    window.deleteMarket = async function(id) { if(confirm("Wipe market?")) await deleteDoc(doc(db, "markets", id)); }
</script>
</body>
</html>
