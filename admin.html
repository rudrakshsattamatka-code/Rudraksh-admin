<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Admin - RUDRAKSH</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #1a1a2e;
            color: white;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: auto;
        }
        .header {
            background: #0f0f1a;
            padding: 20px;
            text-align: center;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #ff8c00;
        }
        .login-box {
            background: #16213e;
            border-radius: 15px;
            padding: 30px;
            max-width: 400px;
            margin: 50px auto;
            text-align: center;
        }
        .login-box h2 {
            margin-bottom: 20px;
            color: #ff8c00;
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #0f0f1a;
            color: white;
            border: 1px solid #ff8c00;
            border-radius: 8px;
            font-size: 16px;
        }
        .login-box button {
            background: #ff8c00;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
        }
        .admin-panel {
            display: none;
        }
        .back-btn {
            background: #333;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
        }
        .section {
            background: #16213e;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .section h3 {
            color: #ff8c00;
            margin-bottom: 15px;
            border-bottom: 1px solid #ff8c00;
            padding-bottom: 8px;
        }
        .market-item {
            background: #0f0f1a;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .market-item h4 {
            color: #ff8c00;
            margin-bottom: 10px;
        }
        .market-item label {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin: 10px 0 5px;
        }
        .market-item input, .market-item select {
            width: 100%;
            padding: 10px;
            background: #1a1a2e;
            color: white;
            border: 1px solid #333;
            border-radius: 6px;
        }
        .market-item input:focus {
            border-color: #ff8c00;
            outline: none;
        }
        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }
        .save-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }
        .save-btn:hover {
            background: #219a52;
        }
        .about-textarea, .contact-textarea {
            width: 100%;
            min-height: 100px;
            padding: 12px;
            background: #0f0f1a;
            color: white;
            border: 1px solid #333;
            border-radius: 8px;
            font-family: Arial;
            font-size: 14px;
        }
        .success {
            background: #27ae60;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            background: #0f0f1a;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #ff8c00;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🔐 RUDRAKSH Admin Panel</h1>
        <p>Edit Results, Free Games, About & Contact</p>
    </div>

    <div id="loginBox" class="login-box">
        <h2>Admin Login</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>

    <div id="adminPanel" class="admin-panel">
        <a href="index.html" class="back-btn">← Back to Website</a>
        
        <div id="successMsg" class="success"></div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchAdminTab('results')">📊 Edit Results (Open/Close/Jodi)</button>
            <button class="tab-btn" onclick="switchAdminTab('freegames')">🎲 Edit Free Games (OTC/Jodi/Panel)</button>
            <button class="tab-btn" onclick="switchAdminTab('other')">⚙️ About & Contact</button>
        </div>

        <div id="adminResultsTab" class="tab-content active">
            <div class="section">
                <h3>📊 Simple Results (7 Markets)</h3>
                <div id="resultsList"></div>
                <button class="save-btn" onclick="saveSimpleResults()">💾 Save Results</button>
            </div>
        </div>

        <div id="adminFreegamesTab" class="tab-content">
            <div class="section">
                <h3>🎲 Free Games (OTC, Jodi, Panel)</h3>
                <div id="freegamesList"></div>
                <button class="save-btn" onclick="saveFreeGames()">💾 Save Free Games</button>
            </div>
        </div>

        <div id="adminOtherTab" class="tab-content">
            <div class="section">
                <h3>📝 Edit About Section</h3>
                <textarea id="aboutText" class="about-textarea" placeholder="Write about content..."></textarea>
                <button class="save-btn" onclick="saveAbout()">💾 Save About</button>
            </div>

            <div class="section">
                <h3>📞 Edit Contact Bar</h3>
                <label>Contact Message</label>
                <textarea id="contactText" class="contact-textarea" placeholder="Contact message..."></textarea>
                <label>WhatsApp Number (with country code)</label>
                <input type="text" id="whatsappNumber" placeholder="+919999999999">
                <label>Call Text</label>
                <input type="text" id="callText" placeholder="📞 Or Call: +91XXXXXXXXXX">
                <button class="save-btn" onclick="saveContact()">💾 Save Contact Bar</button>
            </div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDVxg4EZHm4D2zMrz_ndLzcqx3wkhdPdVc",
        authDomain: "rudraksh-d74c3.firebaseapp.com",
        projectId: "rudraksh-d74c3",
        storageBucket: "rudraksh-d74c3.firebasestorage.app",
        messagingSenderId: "270620722307",
        appId: "1:270620722307:web:5a6454b69e12c201f6c7b6",
        measurementId: "G-406NQEK3XV"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();

    let simpleResults = [];
    let freeGames = [];

    const defaultSimpleResults = [
        { name: "SRIDEVI", open: "123", close: "61", jodi: "560", startTime: "11:45", endTime: "12:45" },
        { name: "TIME BAZAR", open: "230", close: "59", jodi: "450", startTime: "13:10", endTime: "14:10" },
        { name: "MILAN DAY", open: "370", close: "01", jodi: "470", startTime: "15:10", endTime: "17:10" },
        { name: "KALYAN", open: "349", close: "62", jodi: "570", startTime: "15:40", endTime: "17:40" },
        { name: "SRIDEVI NIGHT", open: "380", close: "18", jodi: "350", startTime: "19:25", endTime: "20:25" },
        { name: "MILAN NIGHT", open: "450", close: "96", jodi: "790", startTime: "21:10", endTime: "23:10" },
        { name: "MAIN BAZAR", open: "490", close: "32", jodi: "444", startTime: "22:00", endTime: "00:10" }
    ];

    const defaultFreeGames = [
        { name: "SRIDEVI", otc: "1-4-3-8", jodi: "14-48-34-84", panel: "146-680-148-134", pass: "", type: "normal" },
        { name: "TIME BAZAR", otc: "1-5-9-4", jodi: "19-59-91-45", panel: "119-159-126-158", pass: "", type: "normal" },
        { name: "MADHUR DAY", otc: "1-5-4", jodi: "15-51-54-45-40-04-01-10", panel: "155-122-888-460", pass: "Close (Pass) ((5))", type: "withpass" },
        { name: "MILAN DAY", otc: "5-9-7-4", jodi: "59-95-97-79-74-47-45-54", panel: "168-234-557-257", pass: "Jodi (Pass) ((97))", type: "withpass" },
        { name: "RAJDHANI DAY", otc: "6-5-9-1", jodi: "65-59-91-15", panel: "150-159-126-380", pass: "", type: "normal" },
        { name: "KALYAN", otc: "1-6-2-7", jodi: "12-62-26-76", panel: "128-123-679-160", pass: "Open (Pass) ((7))", type: "withpass" },
        { name: "SRIDEVI NIGHT", otc: "9-4-8-7", jodi: "94-49-48-84-87-78-79-97", panel: "379-112-125-188", pass: "Open (Pass) ((9))", type: "withpass" }
    ];

    async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        try {
            await auth.signInWithEmailAndPassword(email, password);
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            await loadAllData();
        } catch(error) {
            alert('Login failed: ' + error.message);
        }
    }

    async function loadAllData() {
        const simpleSnapshot = await database.ref('simpleResults').once('value');
        simpleResults = simpleSnapshot.val();
        if (!simpleResults || simpleResults.length === 0) {
            simpleResults = defaultSimpleResults;
        }
        displaySimpleResultsForms();

        const freegamesSnapshot = await database.ref('freeGames').once('value');
        freeGames = freegamesSnapshot.val();
        if (!freeGames || freeGames.length === 0) {
            freeGames = defaultFreeGames;
        }
        displayFreeGamesForms();

        const aboutSnapshot = await database.ref('about').once('value');
        const about = aboutSnapshot.val() || "";
        document.getElementById('aboutText').value = about;
        
        const contactSnapshot = await database.ref('contact').once('value');
        const contact = contactSnapshot.val();
        if(contact) {
            document.getElementById('contactText').value = contact.text || "";
            document.getElementById('whatsappNumber').value = contact.whatsappNumber || "+919316742722";
            document.getElementById('callText').value = contact.callText || "📞 Or Call: +919316742722";
        }
    }

    function displaySimpleResultsForms() {
        let html = '';
        for(let i = 0; i < simpleResults.length; i++) {
            html += `
                <div class="market-item">
                    <h4>📊 ${simpleResults[i].name}</h4>
                    <div class="row-3">
                        <div>
                            <label>Open Result</label>
                            <input type="text" id="simple_open_${i}" value="${simpleResults[i].open}">
                        </div>
                        <div>
                            <label>Close Result</label>
                            <input type="text" id="simple_close_${i}" value="${simpleResults[i].close}">
                        </div>
                        <div>
                            <label>Jodi</label>
                            <input type="text" id="simple_jodi_${i}" value="${simpleResults[i].jodi}">
                        </div>
                    </div>
                    <div class="row-2">
                        <div>
                            <label>Start Time</label>
                            <input type="time" id="simple_start_${i}" value="${simpleResults[i].startTime}">
                        </div>
                        <div>
                            <label>End Time</label>
                            <input type="time" id="simple_end_${i}" value="${simpleResults[i].endTime}">
                        </div>
                    </div>
                </div>
            `;
        }
        document.getElementById('resultsList').innerHTML = html;
    }

    function displayFreeGamesForms() {
        let html = '';
        for(let i = 0; i < freeGames.length; i++) {
            html += `
                <div class="market-item">
                    <h4>🎲 ${freeGames[i].name}</h4>
                    <label>Market Name</label>
                    <input type="text" id="free_name_${i}" value="${freeGames[i].name}">
                    <label>OTC Numbers</label>
                    <input type="text" id="free_otc_${i}" value="${freeGames[i].otc}">
                    <label>Jodi Numbers</label>
                    <input type="text" id="free_jodi_${i}" value="${freeGames[i].jodi}">
                    <label>Panel Numbers</label>
                    <input type="text" id="free_panel_${i}" value="${freeGames[i].panel}">
                    <div class="row-2">
                        <div>
                            <label>Pass Text</label>
                            <input type="text" id="free_pass_${i}" value="${freeGames[i].pass || ''}">
                        </div>
                        <div>
                            <label>Type</label>
                            <select id="free_type_${i}">
                                <option value="normal" ${freeGames[i].type === 'normal' ? 'selected' : ''}>Normal</option>
                                <option value="withpass" ${freeGames[i].type === 'withpass' ? 'selected' : ''}>With Pass Badge</option>
                            </select>
                        </div>
                    </div>
                </div>
            `;
        }
        document.getElementById('freegamesList').innerHTML = html;
    }

    async function saveSimpleResults() {
        const updated = [];
        for(let i = 0; i < simpleResults.length; i++) {
            updated.push({
                name: simpleResults[i].name,
                open: document.getElementById(`simple_open_${i}`).value,
                close: document.getElementById(`simple_close_${i}`).value,
                jodi: document.getElementById(`simple_jodi_${i}`).value,
                startTime: document.getElementById(`simple_start_${i}`).value,
                endTime: document.getElementById(`simple_end_${i}`).value
            });
        }
        await database.ref('simpleResults').set(updated);
        showSuccess('✅ Results saved!');
    }

    async function saveFreeGames() {
        const updated = [];
        for(let i = 0; i < freeGames.length; i++) {
            updated.push({
                name: document.getElementById(`free_name_${i}`).value,
                otc: document.getElementById(`free_otc_${i}`).value,
                jodi: document.getElementById(`free_jodi_${i}`).value,
                panel: document.getElementById(`free_panel_${i}`).value,
                pass: document.getElementById(`free_pass_${i}`).value,
                type: document.getElementById(`free_type_${i}`).value
            });
        }
        await database.ref('freeGames').set(updated);
        showSuccess('✅ Free Games saved!');
    }

    async function saveAbout() {
        const content = document.getElementById('aboutText').value;
        await database.ref('about').set(content);
        showSuccess('✅ About saved!');
    }

    async function saveContact() {
        const contact = {
            text: document.getElementById('contactText').value,
            whatsapp: `https://wa.me/${document.getElementById('whatsappNumber').value.replace(/[^0-9]/g, '')}`,
            whatsappNumber: document.getElementById('whatsappNumber').value,
            callText: document.getElementById('callText').value
        };
        await database.ref('contact').set(contact);
        showSuccess('✅ Contact bar saved!');
    }

    function switchAdminTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        
        if(tabName === 'results') {
            document.querySelector('.tab-btn:first-child').classList.add('active');
            document.getElementById('adminResultsTab').classList.add('active');
        } else if(tabName === 'freegames') {
            document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
            document.getElementById('adminFreegamesTab').classList.add('active');
        } else {
            document.querySelector('.tab-btn:nth-child(3)').classList.add('active');
            document.getElementById('adminOtherTab').classList.add('active');
        }
    }

    function showSuccess(msg) {
        const div = document.getElementById('successMsg');
        div.innerHTML = msg;
        div.style.display = 'block';
        setTimeout(() => div.style.display = 'none', 3000);
    }

    auth.onAuthStateChanged((user) => {
        if (user) {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            loadAllData();
        }
    });
</script>
</body>
</html>
