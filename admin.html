<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Admin - RUDRAKSH</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #1a1a2e;
            color: white;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: auto;
        }
        .header {
            background: #0f0f1a;
            padding: 20px;
            text-align: center;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #ff8c00;
        }
        .login-box {
            background: #16213e;
            border-radius: 15px;
            padding: 30px;
            max-width: 400px;
            margin: 50px auto;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        .login-box h2 {
            margin-bottom: 20px;
            color: #ff8c00;
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #0f0f1a;
            color: white;
            border: 1px solid #ff8c00;
            border-radius: 8px;
            font-size: 16px;
        }
        .login-box button {
            background: #ff8c00;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }
        .login-box button:hover {
            background: #e07b00;
        }
        .admin-panel {
            display: none;
        }
        .back-btn {
            background: #333;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            font-size: 14px;
        }
        .back-btn:hover {
            background: #555;
        }
        .section {
            background: #16213e;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .section h3 {
            color: #ff8c00;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ff8c00;
        }
        .market-item {
            background: #0f0f1a;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .market-item h4 {
            color: #ff8c00;
            margin-bottom: 10px;
        }
        .market-item label {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
        }
        .market-item input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background: #1a1a2e;
            color: white;
            border: 1px solid #333;
            border-radius: 6px;
            font-size: 14px;
        }
        .market-item input:focus {
            border-color: #ff8c00;
            outline: none;
        }
        .row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }
        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .save-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }
        .save-btn:hover {
            background: #219a52;
        }
        .about-textarea {
            width: 100%;
            min-height: 150px;
            padding: 12px;
            background: #0f0f1a;
            color: white;
            border: 1px solid #333;
            border-radius: 8px;
            font-family: Arial;
            font-size: 14px;
        }
        .success {
            background: #27ae60;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }
        .error {
            background: #e74c3c;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }
        .loading {
            text-align: center;
            padding: 30px;
            color: #ff8c00;
        }
    </style>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🔐 RUDRAKSH Admin Panel</h1>
        <p>Update Results & Website Content</p>
    </div>

    <!-- Login Box -->
    <div id="loginBox" class="login-box">
        <h2>Admin Login</h2>
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>

    <!-- Admin Panel (hidden until login) -->
    <div id="adminPanel" class="admin-panel">
        <a href="index.html" class="back-btn">← Back to Website</a>
        
        <div id="successMsg" class="success"></div>
        <div id="errorMsg" class="error"></div>

        <!-- About Section Editor -->
        <div class="section">
            <h3>📝 Edit About Section</h3>
            <textarea id="aboutText" class="about-textarea" placeholder="Write about content here..."></textarea>
            <button class="save-btn" onclick="saveAbout()">💾 Save About Section</button>
        </div>

        <!-- Markets Editor -->
        <div class="section">
            <h3>🎲 Edit Market Results</h3>
            <div id="marketsList">
                <div class="loading">Loading markets...</div>
            </div>
            <button class="save-btn" onclick="saveMarkets()">💾 Save All Market Results</button>
        </div>
    </div>
</div>

<script>
    // ============ FIREBASE CONFIG (YOURS) ============
    const firebaseConfig = {
        apiKey: "AIzaSyDVxg4EZHm4D2zMrz_ndLzcqx3wkhdPdVc",
        authDomain: "rudraksh-d74c3.firebaseapp.com",
        projectId: "rudraksh-d74c3",
        storageBucket: "rudraksh-d74c3.firebasestorage.app",
        messagingSenderId: "270620722307",
        appId: "1:270620722307:web:5a6454b69e12c201f6c7b6",
        measurementId: "G-406NQEK3XV"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();

    let markets = [];

    // Default data
    const defaultMarkets = [
        { name: "SRIDEVI", open: "123", close: "61", jodi: "560", startTime: "11:45", endTime: "12:45" },
        { name: "TIME BAZAR", open: "230", close: "59", jodi: "450", startTime: "13:10", endTime: "14:10" },
        { name: "MILAN DAY", open: "370", close: "01", jodi: "470", startTime: "15:10", endTime: "17:10" },
        { name: "KALYAN", open: "349", close: "62", jodi: "570", startTime: "15:40", endTime: "17:40" },
        { name: "SRIDEVI NIGHT", open: "380", close: "18", jodi: "350", startTime: "19:25", endTime: "20:25" },
        { name: "MILAN NIGHT", open: "450", close: "96", jodi: "790", startTime: "21:10", endTime: "23:10" },
        { name: "MAIN BAZAR", open: "490", close: "32", jodi: "444", startTime: "22:00", endTime: "00:10" }
    ];

    // Login function
    async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        if (!email || !password) {
            showError('Please enter both email and password');
            return;
        }
        
        showLoading('Logging in...');
        
        try {
            await auth.signInWithEmailAndPassword(email, password);
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            await loadData();
            showSuccess('Login successful!');
        } catch(error) {
            let errorMessage = 'Login failed: ';
            if (error.code === 'auth/user-not-found') {
                errorMessage += 'User not found. Create admin user in Firebase Console.';
            } else if (error.code === 'auth/wrong-password') {
                errorMessage += 'Wrong password.';
            } else if (error.code === 'auth/invalid-email') {
                errorMessage += 'Invalid email format.';
            } else {
                errorMessage += error.message;
            }
            showError(errorMessage);
        }
    }

    // Load data from Firebase
    async function loadData() {
        try {
            // Try to load markets from database
            const marketsSnapshot = await database.ref('markets').once('value');
            let marketsData = marketsSnapshot.val();
            
            if (marketsData && Array.isArray(marketsData) && marketsData.length > 0) {
                markets = marketsData;
                console.log('Loaded markets from database:', markets);
            } else {
                // Use default data and save to database
                markets = defaultMarkets;
                await database.ref('markets').set(defaultMarkets);
                console.log('Saved default markets to database');
            }
            
            // Display market edit forms
            displayMarketForms();
            
            // Load about text
            const aboutSnapshot = await database.ref('about').once('value');
            let about = aboutSnapshot.val();
            if (!about) {
                about = "RUDRAKSH is an informational platform where you can find basic and updated details about Indian Matka. This website does not provide any betting or gambling services. It is made only for informational purposes. RUDRAKSH focuses on providing fast loading experience, simple design, and useful content.";
                await database.ref('about').set(about);
            }
            document.getElementById('aboutText').value = about;
            
        } catch(error) {
            console.error('Error loading data:', error);
            showError('Error loading data: ' + error.message);
            // Still show default markets as fallback
            markets = defaultMarkets;
            displayMarketForms();
        }
    }
    
    function displayMarketForms() {
        let html = '';
        for(let i = 0; i < markets.length; i++) {
            html += `
                <div class="market-item">
                    <h4>📊 ${markets[i].name}</h4>
                    <div class="row-3">
                        <div>
                            <label>OPEN RESULT</label>
                            <input type="text" id="open_${i}" value="${markets[i].open || '--'}" placeholder="e.g., 123">
                        </div>
                        <div>
                            <label>CLOSE RESULT</label>
                            <input type="text" id="close_${i}" value="${markets[i].close || '--'}" placeholder="e.g., 456">
                        </div>
                        <div>
                            <label>JODI</label>
                            <input type="text" id="jodi_${i}" value="${markets[i].jodi || '--'}" placeholder="e.g., 789">
                        </div>
                    </div>
                    <div class="row-2">
                        <div>
                            <label>START TIME</label>
                            <input type="time" id="start_${i}" value="${markets[i].startTime || '12:00'}">
                        </div>
                        <div>
                            <label>END TIME</label>
                            <input type="time" id="end_${i}" value="${markets[i].endTime || '13:00'}">
                        </div>
                    </div>
                </div>
            `;
        }
        document.getElementById('marketsList').innerHTML = html;
    }

    // Save all markets
    async function saveMarkets() {
        try {
            const updatedMarkets = [];
            for(let i = 0; i < markets.length; i++) {
                const openVal = document.getElementById(`open_${i}`)?.value || '--';
                const closeVal = document.getElementById(`close_${i}`)?.value || '--';
                const jodiVal = document.getElementById(`jodi_${i}`)?.value || '--';
                const startVal = document.getElementById(`start_${i}`)?.value || '12:00';
                const endVal = document.getElementById(`end_${i}`)?.value || '13:00';
                
                updatedMarkets.push({
                    name: markets[i].name,
                    open: openVal,
                    close: closeVal,
                    jodi: jodiVal,
                    startTime: startVal,
                    endTime: endVal
                });
            }
            
            await database.ref('markets').set(updatedMarkets);
            showSuccess('✅ All market results saved! Users will see updates immediately when they refresh.');
            
            // Update local markets array
            markets = updatedMarkets;
            
        } catch(error) {
            console.error('Error saving markets:', error);
            showError('Error saving markets: ' + error.message);
        }
    }

    // Save about section
    async function saveAbout() {
        try {
            const content = document.getElementById('aboutText').value;
            await database.ref('about').set(content);
            showSuccess('✅ About section saved!');
        } catch(error) {
            console.error('Error saving about:', error);
            showError('Error saving about: ' + error.message);
        }
    }

    // Show success message
    function showSuccess(message) {
        const div = document.getElementById('successMsg');
        div.innerHTML = message;
        div.style.display = 'block';
        setTimeout(() => {
            div.style.display = 'none';
        }, 3000);
    }

    // Show error message
    function showError(message) {
        const div = document.getElementById('errorMsg');
        div.innerHTML = message;
        div.style.display = 'block';
        setTimeout(() => {
            div.style.display = 'none';
        }, 4000);
    }
    
    function showLoading(message) {
        const div = document.getElementById('errorMsg');
        div.innerHTML = message;
        div.style.display = 'block';
        div.style.background = '#ff8c00';
        setTimeout(() => {
            div.style.display = 'none';
            div.style.background = '#e74c3c';
        }, 2000);
    }

    // Auto redirect if already logged in
    auth.onAuthStateChanged((user) => {
        if (user) {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            loadData();
        }
    });
</script>
</body>
</html>
