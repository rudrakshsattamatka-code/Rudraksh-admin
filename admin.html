<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Admin - RUDRAKSH</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:Arial,sans-serif;background:#1a1a2e;color:white;padding:20px;}
        .container{max-width:1000px;margin:auto;}
        .header{background:#0f0f1a;padding:20px;text-align:center;border-radius:15px;margin-bottom:20px;}
        .header h1{color:#ff8c00;}
        .login-box{background:#16213e;border-radius:15px;padding:30px;max-width:400px;margin:50px auto;text-align:center;}
        .login-box h2{margin-bottom:20px;color:#ff8c00;}
        .login-box input{width:100%;padding:12px;margin:10px 0;background:#0f0f1a;color:white;border:1px solid #ff8c00;border-radius:8px;}
        .login-box button{background:#ff8c00;padding:12px;border:none;border-radius:8px;cursor:pointer;width:100%;font-size:16px;font-weight:bold;}
        .admin-panel{display:none;}
        .back-btn{background:#333;padding:10px 20px;border-radius:8px;cursor:pointer;display:inline-block;margin-bottom:20px;text-decoration:none;color:white;}
        .section{background:#16213e;border-radius:15px;padding:20px;margin-bottom:20px;}
        .section h3{color:#ff8c00;margin-bottom:15px;border-bottom:1px solid #ff8c00;padding-bottom:8px;}
        .market-item{background:#0f0f1a;border-radius:10px;padding:15px;margin-bottom:15px;}
        .market-item h4{color:#ff8c00;margin-bottom:10px;}
        .market-item label{display:block;font-size:12px;color:#aaa;margin:10px 0 5px;}
        .market-item input,.market-item select{width:100%;padding:10px;background:#1a1a2e;color:white;border:1px solid #333;border-radius:6px;}
        .row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
        .row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
        .save-btn{background:#27ae60;padding:14px;border:none;border-radius:8px;cursor:pointer;width:100%;font-size:16px;font-weight:bold;margin-top:10px;color:white;}
        .about-textarea,.contact-textarea{width:100%;min-height:100px;padding:12px;background:#0f0f1a;color:white;border:1px solid #333;border-radius:8px;}
        .success{background:#27ae60;padding:12px;border-radius:8px;text-align:center;margin-bottom:15px;display:none;}
        .tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
        .tab-btn{background:#0f0f1a;border:none;padding:10px 20px;border-radius:8px;color:white;cursor:pointer;}
        .tab-btn.active{background:#ff8c00;}
        .tab-content{display:none;}
        .tab-content.active{display:block;}
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>
<div class="container">
    <div class="header"><h1>🔐 RUDRAKSH Admin Panel</h1><p>Edit Results, Free Games, About & Contact</p></div>
    <div id="loginBox" class="login-box">
        <h2>Admin Login</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>
    <div id="adminPanel" class="admin-panel">
        <a href="index.html" class="back-btn">← Back to Website</a>
        <div id="successMsg" class="success"></div>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchAdminTab('results')">📊 Edit Results</button>
            <button class="tab-btn" onclick="switchAdminTab('freegames')">🎲 Edit Free Games</button>
            <button class="tab-btn" onclick="switchAdminTab('other')">⚙️ About & Contact</button>
        </div>
        <div id="adminResultsTab" class="tab-content active">
            <div class="section"><h3>📊 Simple Results (7 Markets)</h3><div id="resultsList"></div><button class="save-btn" onclick="saveSimpleResults()">💾 Save Results</button></div>
        </div>
        <div id="adminFreegamesTab" class="tab-content">
            <div class="section"><h3>🎲 Free Games (OTC, Jodi, Panel)</h3><div id="freegamesList"></div><button class="save-btn" onclick="saveFreeGames()">💾 Save Free Games</button></div>
        </div>
        <div id="adminOtherTab" class="tab-content">
            <div class="section"><h3>📝 Edit About Section</h3><textarea id="aboutText" class="about-textarea"></textarea><button class="save-btn" onclick="saveAbout()">💾 Save About</button></div>
            <div class="section"><h3>📞 Edit Contact Bar</h3><textarea id="contactText" class="contact-textarea" placeholder="Contact message..."></textarea><input type="text" id="whatsappNumber" placeholder="WhatsApp Number"><input type="text" id="callText" placeholder="Call Text"><button class="save-btn" onclick="saveContact()">💾 Save Contact</button></div>
        </div>
    </div>
</div>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDVxg4EZHm4D2zMrz_ndLzcqx3wkhdPdVc",
        authDomain: "rudraksh-d74c3.firebaseapp.com",
        projectId: "rudraksh-d74c3",
        storageBucket: "rudraksh-d74c3.firebasestorage.app",
        messagingSenderId: "270620722307",
        appId: "1:270620722307:web:5a6454b69e12c201f6c7b6",
        measurementId: "G-406NQEK3XV"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();
    let simpleResults = [], freeGames = [];
    const defaultSimpleResults = [
        { name: "SRIDEVI", open: "123", close: "61", jodi: "560", startTime: "11:45", endTime: "12:45" },
        { name: "TIME BAZAR", open: "230", close: "59", jodi: "450", startTime: "13:10", endTime: "14:10" },
        { name: "MILAN DAY", open: "370", close: "01", jodi: "470", startTime: "15:10", endTime: "17:10" },
        { name: "KALYAN", open: "349", close: "62", jodi: "570", startTime: "15:40", endTime: "17:40" },
        { name: "SRIDEVI NIGHT", open: "380", close: "18", jodi: "350", startTime: "19:25", endTime: "20:25" },
        { name: "MILAN NIGHT", open: "450", close: "96", jodi: "790", startTime: "21:10", endTime: "23:10" },
        { name: "MAIN BAZAR", open: "490", close: "32", jodi: "444", startTime: "22:00", endTime: "00:10" }
    ];
    const defaultFreeGames = [
        { name: "SRIDEVI", otc: "1-4-3-8", jodi: "14-48-34-84", panel: "146-680-148-134", pass: "", type: "normal" },
        { name: "TIME BAZAR", otc: "1-5-9-4", jodi: "19-59-91-45", panel: "119-159-126-158", pass: "", type: "normal" },
        { name: "MADHUR DAY", otc: "1-5-4", jodi: "15-51-54-45-40-04-01-10", panel: "155-122-888-460", pass: "Close (Pass) ((5))", type: "withpass" },
        { name: "MILAN DAY", otc: "5-9-7-4", jodi: "59-95-97-79-74-47-45-54", panel: "168-234-557-257", pass: "Jodi (Pass) ((97))", type: "withpass" },
        { name: "RAJDHANI DAY", otc: "6-5-9-1", jodi: "65-59-91-15", panel: "150-159-126-380", pass: "", type: "normal" },
        { name: "KALYAN", otc: "1-6-2-7", jodi: "12-62-26-76", panel: "128-123-679-160", pass: "Open (Pass) ((7))", type: "withpass" },
        { name: "SRIDEVI NIGHT", otc: "9-4-8-7", jodi: "94-49-48-84-87-78-79-97", panel: "379-112-125-188", pass: "Open (Pass) ((9))", type: "withpass" }
    ];
    async function login() {
        try {
            await auth.signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('password').value);
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            await loadAllData();
        } catch(e) { alert('Login failed: ' + e.message); }
    }
    async function loadAllData() {
        const s = await database.ref('simpleResults').once('value');
        simpleResults = s.val() || defaultSimpleResults;
        displaySimpleResultsForms();
        const f = await database.ref('freeGames').once('value');
        freeGames = f.val() || defaultFreeGames;
        displayFreeGamesForms();
        const a = await database.ref('about').once('value');
        document.getElementById('aboutText').value = a.val() || "";
        const c = await database.ref('contact').once('value');
        const ct = c.val();
        if(ct) {
            document.getElementById('contactText').value = ct.text || "";
            document.getElementById('whatsappNumber').value = ct.whatsappNumber || "+919316742722";
            document.getElementById('callText').value = ct.callText || "📞 Or Call: +919316742722";
        }
    }
    function displaySimpleResultsForms() {
        let h = '';
        for(let i=0;i<simpleResults.length;i++) h+=`<div class="market-item"><h4>📊 ${simpleResults[i].name}</h4><div class="row-3"><div><label>Open</label><input id="so_${i}" value="${simpleResults[i].open}"></div><div><label>Close</label><input id="sc_${i}" value="${simpleResults[i].close}"></div><div><label>Jodi</label><input id="sj_${i}" value="${simpleResults[i].jodi}"></div></div><div class="row-2"><div><label>Start</label><input type="time" id="ss_${i}" value="${simpleResults[i].startTime}"></div><div><label>End</label><input type="time" id="se_${i}" value="${simpleResults[i].endTime}"></div></div></div>`;
        document.getElementById('resultsList').innerHTML = h;
    }
    function displayFreeGamesForms() {
        let h = '';
        for(let i=0;i<freeGames.length;i++) h+=`<div class="market-item"><h4>🎲 ${freeGames[i].name}</h4><label>Name</label><input id="fn_${i}" value="${freeGames[i].name}"><label>OTC</label><input id="fo_${i}" value="${freeGames[i].otc}"><label>Jodi</label><input id="fj_${i}" value="${freeGames[i].jodi}"><label>Panel</label><input id="fp_${i}" value="${freeGames[i].panel}"><div class="row-2"><div><label>Pass</label><input id="fpa_${i}" value="${freeGames[i].pass||''}"></div><div><label>Type</label><select id="ft_${i}"><option ${freeGames[i].type==='normal'?'selected':''}>normal</option><option ${freeGames[i].type==='withpass'?'selected':''}>withpass</option></select></div></div></div>`;
        document.getElementById('freegamesList').innerHTML = h;
    }
    async function saveSimpleResults() {
        let u = [];
        for(let i=0;i<simpleResults.length;i++) u.push({name:simpleResults[i].name,open:document.getElementById(`so_${i}`).value,close:document.getElementById(`sc_${i}`).value,jodi:document.getElementById(`sj_${i}`).value,startTime:document.getElementById(`ss_${i}`).value,endTime:document.getElementById(`se_${i}`).value});
        await database.ref('simpleResults').set(u);
        showSuccess('✅ Results saved!');
    }
    async function saveFreeGames() {
        let u = [];
        for(let i=0;i<freeGames.length;i++) u.push({name:document.getElementById(`fn_${i}`).value,otc:document.getElementById(`fo_${i}`).value,jodi:document.getElementById(`fj_${i}`).value,panel:document.getElementById(`fp_${i}`).value,pass:document.getElementById(`fpa_${i}`).value,type:document.getElementById(`ft_${i}`).value});
        await database.ref('freeGames').set(u);
        showSuccess('✅ Free Games saved!');
    }
    async function saveAbout() { await database.ref('about').set(document.getElementById('aboutText').value); showSuccess('✅ About saved!'); }
    async function saveContact() {
        await database.ref('contact').set({
            text: document.getElementById('contactText').value,
            whatsapp: `https://wa.me/${document.getElementById('whatsappNumber').value.replace(/[^0-9]/g,'')}`,
            whatsappNumber: document.getElementById('whatsappNumber').value,
            callText: document.getElementById('callText').value
        });
        showSuccess('✅ Contact saved!');
    }
    function switchAdminTab(t) {
        document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
        if(t==='results'){ document.querySelector('.tab-btn:first-child').classList.add('active'); document.getElementById('adminResultsTab').classList.add('active'); }
        else if(t==='freegames'){ document.querySelector('.tab-btn:nth-child(2)').classList.add('active'); document.getElementById('adminFreegamesTab').classList.add('active'); }
        else{ document.querySelector('.tab-btn:nth-child(3)').classList.add('active'); document.getElementById('adminOtherTab').classList.add('active'); }
    }
    function showSuccess(m) { let d=document.getElementById('successMsg'); d.innerHTML=m; d.style.display='block'; setTimeout(()=>d.style.display='none',3000); }
    auth.onAuthStateChanged(u=>{ if(u){ document.getElementById('loginBox').style.display='none'; document.getElementById('adminPanel').style.display='block'; loadAllData(); } });
</script>
</body>
</html>
